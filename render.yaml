# Render Blueprint specification for SlothFinance
# Qualifies for the Hacktoberfest 2026: Best Use of Render prize category ($200)

services:
  # 1. Full-Stack Web App Frontend (Vite + React Static Site)
  - type: web
    name: sloth-finance-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

  # 2. Python AI Engine Backend (FastAPI + TabPFN + Gemma API)
  - type: web
    name: sloth-finance-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: PORT
        value: 10000
